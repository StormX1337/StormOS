name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  dotnet-portable:
    name: .NET (Linux, portable projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StormOS.Portable.slnf
      - run: dotnet build StormOS.Portable.slnf --no-restore -c Release
      - run: dotnet test StormOS.Portable.slnf --no-build -c Release --logger "trx;LogFilePrefix=portable" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  dotnet-windows:
    name: .NET (Windows, full solution incl. WinUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StormOS.slnx
      - run: dotnet build StormOS.slnx --no-restore -c Release
      - run: dotnet test StormOS.slnx --no-build -c Release --logger "trx;LogFilePrefix=windows" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults

  cloud:
    name: Cloud (API, web, admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storm_test
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storm -d storm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://storm:storm-ci-only@localhost:5432/storm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cloud/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Apply migrations to the test database
        run: pnpm --filter @storm/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test

  installer:
    name: Installer (MSI, x64)
    runs-on: windows-latest
    needs: dotnet-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish app, service and CLI, then build the MSI
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -Version "0.1.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stormos-msi-x64
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.sha256
