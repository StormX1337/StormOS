name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  dotnet-portable:
    name: .NET (Linux, portable projects)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StormOS.Portable.slnf
      - run: dotnet build StormOS.Portable.slnf --no-restore -c Release
      - run: dotnet test StormOS.Portable.slnf --no-build -c Release --logger "trx;LogFilePrefix=portable" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  dotnet-windows:
    name: .NET (Windows, full solution incl. WinUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StormOS.slnx
      - run: dotnet build StormOS.slnx --no-restore -c Release
      - run: dotnet test StormOS.slnx --no-build -c Release --logger "trx;LogFilePrefix=windows" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults

  cloud:
    name: Cloud (API, web, admin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storm_test
          POSTGRES_USER: storm
          POSTGRES_PASSWORD: storm-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U storm -d storm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://storm:storm-ci-only@localhost:5432/storm_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cloud/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cloud/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - name: Apply migrations to the test database
        run: pnpm --filter @storm/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm test

  installer:
    name: Installer (MSI + setup exe, x64)
    runs-on: windows-latest
    needs: dotnet-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Publish app, service and CLI, then build the MSI and the setup exe
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime win-x64 -Version "0.1.0-ci.${{ github.run_number }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stormos-installer-x64
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.exe
            artifacts/installer/*.sha256

  installer-preview:
    name: Installer smoke test + screenshots (x64)
    runs-on: windows-latest
    needs: installer
    permissions:
      contents: write # only to publish the screenshots to refs/ci/installer-preview (not a branch)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stormos-installer-x64
          path: artifacts/installer
      - name: Install through the setup UI, check service and CLI, capture screens, uninstall
        shell: powershell
        run: |
          $setup = Get-ChildItem artifacts/installer -Filter 'StormOS-Setup-*.exe' | Select-Object -First 1
          ./scripts/installer-preview.ps1 -Setup $setup.FullName -Out artifacts/preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-preview-x64
          path: artifacts/preview
      - name: Publish screenshots to refs/ci/installer-preview
        if: always() && github.event_name == 'push'
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if (-not (Get-ChildItem artifacts/preview -Filter *.png -ErrorAction SilentlyContinue)) { Write-Host 'No screenshots captured.'; exit 0 }
          # Orphan commit built from a separate index: the screenshots never touch a branch.
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'preview.index'
          $files = Get-ChildItem artifacts/preview -File | Where-Object { $_.Extension -in '.png', '.txt' } | ForEach-Object { "artifacts/preview/$($_.Name)" }
          git add -f -- @files
          $tree = git write-tree
          $commit = git commit-tree $tree -m "Installer preview for ${{ github.sha }} (run ${{ github.run_number }})"
          git push -f origin "${commit}:refs/ci/installer-preview"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the screenshots.' }
