name: STORM OS image pipeline

on:
  push:
    branches: [main, "claude/**"]
    paths: ["storm-os/**", ".github/workflows/storm-os.yml"]
  pull_request:
    paths: ["storm-os/**", ".github/workflows/storm-os.yml"]
  workflow_dispatch:
    inputs:
      source_iso_url:
        description: "Official Microsoft Windows 11 ISO URL (default: Windows 11 Enterprise evaluation media)"
        required: false
      edition_index:
        description: "Edition index to build"
        required: false
        default: "1"

permissions:
  contents: read

concurrency:
  group: storm-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pester-linux:
    name: Build engine tests (PowerShell 7, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: pwsh
        working-directory: storm-os
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) { Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck }
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/build'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  pester-windows:
    name: Build engine tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: powershell
        working-directory: storm-os
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0')) { Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck }
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/build'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config

  iso:
    name: Build and boot StormOS.iso (Windows 11 evaluation media)
    runs-on: windows-latest
    needs: [pester-linux, pester-windows]
    if: github.event_name != 'pull_request'
    timeout-minutes: 240
    permissions:
      contents: write # only to publish the report and screenshots to refs/ci/storm-os-build (not a branch)
    steps:
      - uses: actions/checkout@v4
      - name: Choose the build drive
        shell: powershell
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{ n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }, @{ n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) } }
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Name -in 'C', 'D' } | Sort-Object Free -Descending | Select-Object -First 1
          $root = "$($drive.Name):\StormBuild"
          robocopy storm-os "$root\storm-os" /E /NFL /NDL /NJH /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw "robocopy failed: $LASTEXITCODE" }
          "STORM_ROOT=$root\storm-os" >> $env:GITHUB_ENV
          "STORM_SOURCE=$root\source\source.iso" >> $env:GITHUB_ENV
          Write-Host "Building on $($drive.Name): ($([math]::Round($drive.Free / 1GB, 1)) GB free)"
          exit 0  # robocopy returns 1 for "files copied"
      - name: Install Windows ADK Deployment Tools (oscdimg) and QEMU
        shell: powershell
        run: |
          $oscdimg = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe" -ErrorAction SilentlyContinue
          if (-not $oscdimg) { choco install windows-adk-deploy -y --no-progress; if ($LASTEXITCODE -ne 0) { throw 'ADK installation failed' } }
          choco install qemu -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'QEMU installation failed' }
          exit 0
      - name: Download Windows 11 evaluation media from Microsoft
        shell: powershell
        env:
          SOURCE_URL: ${{ inputs.source_iso_url || vars.STORM_SOURCE_ISO_URL }}
        run: |
          $arguments = @{ Destination = $env:STORM_SOURCE }
          if ($env:SOURCE_URL) { $arguments.Url = $env:SOURCE_URL }
          & "$env:STORM_ROOT\tests\ci\Get-StormEvaluationIso.ps1" @arguments
      - name: Prerequisites
        shell: powershell
        run: |
          & "$env:STORM_ROOT\scripts\00-check-prerequisites.ps1" -SourceIso $env:STORM_SOURCE
          exit $LASTEXITCODE
      - name: Build StormOS.iso (build-all)
        shell: powershell
        env:
          EDITION: ${{ inputs.edition_index || '1' }}
        run: |
          & "$env:STORM_ROOT\scripts\build-all.ps1" -SourceIso $env:STORM_SOURCE -EditionIndex ([int]$env:EDITION) -BuildVersion "1.0.0-ci.${{ github.run_number }}" -EnableGamingDefaults -NoBootPrompt -CleanBuild -KeepTemp
          exit $LASTEXITCODE
      - name: VM boot test (QEMU, UEFI)
        shell: powershell
        run: |
          & "$env:STORM_ROOT\scripts\14-test-vm.ps1" -Hypervisor Qemu -VmBootMinutes 25
          exit $LASTEXITCODE
      - name: Get the VM installation job's one-time public key
        id: vmkey
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: vm-public-key
          path: vmkey
      - name: Seal StormOS.iso for the VM installation job (only that job can decrypt it)
        if: steps.vmkey.outcome == 'success'
        shell: pwsh
        run: |
          $openssl = 'C:\Program Files\Git\usr\bin\openssl.exe'
          $sealed = Join-Path $env:RUNNER_TEMP 'sealed'
          New-Item -ItemType Directory -Path $sealed -Force | Out-Null
          $key = Join-Path $env:RUNNER_TEMP 'iso-key.txt'
          (& $openssl rand -hex 32) | Set-Content -Path $key -NoNewline -Encoding ascii
          & $openssl enc -aes-256-ctr -pbkdf2 -pass "file:$key" -in "$env:STORM_ROOT\build\output\StormOS.iso" -out (Join-Path $sealed 'StormOS.iso.enc')
          if ($LASTEXITCODE -ne 0) { throw 'Encryption failed.' }
          & $openssl pkeyutl -encrypt -pubin -inkey vmkey/vm-public-key.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in $key -out (Join-Path $sealed 'key.enc')
          if ($LASTEXITCODE -ne 0) { throw 'Key wrapping failed.' }
          Remove-Item $key -Force
      - name: Upload the sealed ISO (encrypted, deleted by the VM job)
        if: steps.vmkey.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: stormos-iso-sealed
          path: ${{ runner.temp }}/sealed
          compression-level: 0
          retention-days: 1
      - name: Collect report, logs and screenshots (never the ISO or WIM)
        if: always()
        shell: powershell
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE 'storm-os-ci'
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item "$env:STORM_ROOT\build\output\storm-build-report.json" $out -ErrorAction SilentlyContinue
          Copy-Item "$env:STORM_ROOT\build\output\*.sha256" $out -ErrorAction SilentlyContinue
          Get-ChildItem "$env:STORM_ROOT\build\logs" -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne 'dism.log' } | ForEach-Object { Copy-Item $_.FullName (Join-Path $out ($_.BaseName + '.txt')) }
          if (Test-Path "$env:STORM_ROOT\build\logs\dism.log") { Get-Content "$env:STORM_ROOT\build\logs\dism.log" -Tail 400 | Set-Content (Join-Path $out 'dism-tail.txt') }
          Get-ChildItem "$env:STORM_ROOT\build\artifacts\vm" -Include *.png, *.log -Recurse -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName $out }
          Copy-Item "$env:STORM_SOURCE.sha256" (Join-Path $out 'source-iso.sha256') -ErrorAction SilentlyContinue
          Get-ChildItem $out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storm-os-build-report
          path: storm-os-ci
      - name: Publish report and screenshots to refs/ci/storm-os-build
        if: always() && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if (-not (Test-Path storm-os-ci) -or -not (Get-ChildItem storm-os-ci)) { Write-Host 'Nothing to publish.'; exit 0 }
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'storm-os-ci.index'
          $files = Get-ChildItem storm-os-ci -File | Where-Object { $_.Extension -in '.png', '.txt', '.json', '.sha256', '.log', '.jsonl' -and $_.Length -lt 20MB } | ForEach-Object { "storm-os-ci/$($_.Name)" }
          git add -f -- @files
          $tree = git write-tree
          $commit = git commit-tree $tree -m "STORM OS build report for ${{ github.sha }} (run ${{ github.run_number }})"
          git push -f origin "${commit}:refs/ci/storm-os-build"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the report.' }

  vm-install:
    name: Install StormOS.iso in a Windows 11-compliant VM (KVM, Secure Boot, TPM 2.0)
    runs-on: ubuntu-latest
    needs: [pester-linux, pester-windows]
    if: github.event_name != 'pull_request'
    timeout-minutes: 240
    permissions:
      contents: write # only to publish screenshots to refs/ci/storm-os-vm (not a branch)
      actions: write # read this run's artifacts and delete the sealed ISO afterwards
    steps:
      - uses: actions/checkout@v4
      - name: One-time key pair for receiving the sealed ISO (private key never leaves this runner)
        run: |
          mkdir -p "$RUNNER_TEMP/vmkey" vmkey-public
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "$RUNNER_TEMP/vmkey/private.pem" 2>/dev/null
          openssl pkey -in "$RUNNER_TEMP/vmkey/private.pem" -pubout -out vmkey-public/vm-public-key.pem
      - uses: actions/upload-artifact@v4
        with:
          name: vm-public-key
          path: vmkey-public/vm-public-key.pem
          retention-days: 1
      - name: KVM, QEMU, OVMF (Secure Boot with Microsoft keys), swtpm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools xorriso
          ls -l /dev/kvm /usr/share/OVMF/
          sudo mkdir -p /mnt/storm
          sudo chown "$USER" /mnt/storm
          df -h / /mnt
      - name: Wait for the sealed StormOS.iso from the Windows build job
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifacts="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          jobs="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs"
          for i in $(seq 1 180); do
            id=$(gh api "$artifacts" --jq '.artifacts[] | select(.name=="stormos-iso-sealed") | .id' || true)
            if [ -n "$id" ]; then echo "artifact_id=$id" >> "$GITHUB_OUTPUT"; echo "Sealed ISO ready (artifact $id)"; exit 0; fi
            state=$(gh api "$jobs" --jq '.jobs[] | select(.name | startswith("Build and boot")) | .status + "/" + (.conclusion // "")' || true)
            case "$state" in
              completed/*) sleep 20; id=$(gh api "$artifacts" --jq '.artifacts[] | select(.name=="stormos-iso-sealed") | .id' || true)
                           if [ -n "$id" ]; then echo "artifact_id=$id" >> "$GITHUB_OUTPUT"; exit 0; fi
                           echo "The ISO build job finished ($state) without a sealed ISO."; exit 1 ;;
            esac
            sleep 60
          done
          echo "Timed out waiting for the ISO."; exit 1
      - uses: actions/download-artifact@v4
        with:
          name: stormos-iso-sealed
          path: /mnt/storm/sealed
      - name: Unseal StormOS.iso
        run: |
          openssl pkeyutl -decrypt -inkey "$RUNNER_TEMP/vmkey/private.pem" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in /mnt/storm/sealed/key.enc -out "$RUNNER_TEMP/vmkey/iso-key.txt"
          openssl enc -d -aes-256-ctr -pbkdf2 -pass "file:$RUNNER_TEMP/vmkey/iso-key.txt" -in /mnt/storm/sealed/StormOS.iso.enc -out /mnt/storm/StormOS.iso
          rm -rf /mnt/storm/sealed "$RUNNER_TEMP/vmkey/iso-key.txt"
          ls -l /mnt/storm
      - name: Delete the sealed ISO artifact
        if: always() && steps.wait.outputs.artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${{ steps.wait.outputs.artifact_id }}"
      - name: Install in the VM and capture the installed system
        shell: pwsh
        run: ./storm-os/tests/vm/Invoke-StormVmInstallTest.ps1 -IsoPath /mnt/storm/StormOS.iso -WorkDirectory /mnt/storm/vm -OutputDirectory storm-os-vm
      - name: Remove the ISO from the runner
        if: always()
        run: rm -rf /mnt/storm/StormOS.iso /mnt/storm/vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storm-os-vm-screenshots
          path: storm-os-vm
      - name: Publish screenshots to refs/ci/storm-os-vm
        if: always()
        shell: pwsh
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if (-not (Test-Path storm-os-vm) -or -not (Get-ChildItem storm-os-vm)) { Write-Host 'Nothing to publish.'; exit 0 }
          $env:GIT_INDEX_FILE = Join-Path $env:RUNNER_TEMP 'storm-os-vm.index'
          $files = Get-ChildItem storm-os-vm -File | Where-Object { $_.Extension -in '.png', '.json', '.log' -and $_.Length -lt 20MB } | ForEach-Object { "storm-os-vm/$($_.Name)" }
          git add -f -- @files
          $tree = git write-tree
          $commit = git commit-tree $tree -m "STORM OS VM installation screenshots for ${{ github.sha }} (run ${{ github.run_number }})"
          git push -f origin "${commit}:refs/ci/storm-os-vm"
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the screenshots.' }
