name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without the leading v (e.g. 1.2.0)"
        required: true

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build ${{ matrix.runtime }}
    runs-on: windows-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_PFX_BASE64 != '' }}
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Test
        run: dotnet test StormOS.slnx -c Release
      - name: Import code signing certificate
        if: env.HAS_SIGNING == 'true'
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX))
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:SIGNING_PASSWORD -AsPlainText -Force)
          Remove-Item $pfx
          "SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - name: Publish and build installer
        shell: pwsh
        run: ./scripts/publish.ps1 -Runtime ${{ matrix.runtime }} -Version ${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.runtime }}
          path: |
            artifacts/installer/*.msi
            artifacts/installer/*.sha256

  publish:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
