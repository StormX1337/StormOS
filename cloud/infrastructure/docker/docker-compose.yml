# STORM Cloud stack: PostgreSQL, Redis, API, web portal, admin panel and an Nginx edge.
# Usage (from cloud/): cp .env.example .env && edit, then
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file .env up -d --build
name: storm-cloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storm}
      POSTGRES_USER: ${POSTGRES_USER:-storm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-storm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-storm}
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
      PORT: "4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [backend, edge]

  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/next.Dockerfile
      args: { APP: web }
    restart: unless-stopped
    environment:
      STORM_API_URL: http://api:4000
    depends_on: [api]
    networks: [edge]

  admin:
    build:
      context: ../..
      dockerfile: infrastructure/docker/next.Dockerfile
      args: { APP: admin }
    restart: unless-stopped
    environment:
      STORM_API_URL: http://api:4000
      PORT: "3000"
    depends_on: [api]
    networks: [edge]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${TLS_CERT_DIR:-../nginx/certs}:/etc/nginx/certs:ro
    depends_on: [api, web, admin]
    networks: [edge]

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  edge:
