# Edge proxy for STORM Cloud. Terminates TLS; certificates are mounted at /etc/nginx/certs
# (fullchain.pem / privkey.pem, e.g. from certbot). Hostnames are configured below.
worker_processes auto;
events { worker_connections 2048; }

http {
  server_tokens off;
  sendfile on;
  client_max_body_size 512k;
  proxy_read_timeout 60s;

  # Per-IP limits in front of the API's own rate limiting.
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;

  server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
  }

  # API: api.stormos.app
  server {
    listen 443 ssl;
    http2 on;
    server_name api.stormos.app;

    location /api/v1/auth/ {
      limit_req zone=auth burst=10 nodelay;
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Web portal: stormos.app
  server {
    listen 443 ssl;
    http2 on;
    server_name stormos.app www.stormos.app;
    location / {
      proxy_pass http://web:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Admin panel: admin.stormos.app (restrict further with an IP allow-list or SSO in front where possible).
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.stormos.app;
    location / {
      proxy_pass http://admin:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
